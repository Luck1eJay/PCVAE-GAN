# ---------------------------
# PCVAE-GAN 参数配置文件
# ---------------------------
data:
  sim_path: "data/sim/"        # 模拟 wrap + phi 数据路径
  real_path: "data/real/"      # 真实 wrap 数据路径

model:
  z_dim: 32                    # VAE latent 维度
  encoder_channels: [1,32,64]  # Encoder 卷积通道
  decoder_channels: [64,32,1]  # Decoder 卷积通道

train:
  batch_size: 8
  lr_vae: 1e-4
  lr_disc: 1e-4
  epochs_stage1: 50
  epochs_stage2: 50
  epochs_stage3: 30
  kl_weight: 0.1
  gan_weight: 0.01
  diversity_weight: 0.05

loss:
  sup_weight: 1.0
  wrap_weight: 0.5
